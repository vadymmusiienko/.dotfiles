# --- Tmux Configuration File ---

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Set default terminal to tmux-256color and advertise truecolor (RGB)
# Gives accurate Rose Pine colors in Ghostty and other truecolor terminals
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 10000

# Renumber windows when a window is closed
set -g renumber-windows on

# Set window and pane titles automatically
setw -g automatic-rename on
set -g set-titles on

# Extend the repeat window for -r bindings (default is 500ms)
set -g repeat-time 1000

# NOTE: Activity/bell monitoring is intentionally disabled in the
# MISCELLANEOUS SETTINGS section below.

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Change default prefix from Ctrl-b to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using \ ( same as | ) and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane switching
# NOTE: pane switching with <leader> + h,j,k,l
# TODO: Keep commented out if using vim-tmux-navigator (Uses <ctr> + h,j,k,l)
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Resize panes using Shift+arrow keys
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# Create new window
bind c new-window -c "#{pane_current_path}"

# Vim-style window switching (leader + h/l)
bind -r h previous-window
bind -r l next-window

# NOTE: I changed this section to work for linux machines as well
# # ============================================================================
# # COPY MODE (VI STYLE)
# # ============================================================================
#
# # Use vi mode
# setw -g mode-keys vi
#
# # Setup 'v' to begin selection as in Vim
# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
#
# # Update default binding of `Enter` to also use copy-pipe
# unbind -T copy-mode-vi Enter
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
#
# ============================================================================
# COPY MODE (VI STYLE)
# ============================================================================

# Use vi mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy to clipboard - works on macOS and Linux (X11/Wayland)
if-shell '[ "$(uname)" = "Darwin" ]' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell '[ -n "$WAYLAND_DISPLAY" ]' {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    }
}

# ============================================================================
# STATUS BAR DESIGN
# ============================================================================

# Status bar colors
set -g status-bg colour235          # Rose Pine base
set -g status-fg colour254          # Rose Pine text

# Clock settings
setw -g clock-mode-colour colour183

# Copy mode colors
setw -g mode-style 'fg=black bg=red bold'

# Status bar position
set -g status-position bottom

# Status bar segments
set -g status-left-length 25
set -g status-left '#[fg=colour235,bg=colour183,bold] #S #[fg=colour183,bg=colour235,nobold]'

set -g status-right-length 60
set -g status-right '#[fg=colour235] %Y-%m-%d #[fg=colour235]%H:%M #[fg=colour235,bg=colour152,bold] #h '

# Window status format
setw -g window-status-format '#[fg=colour247] #I #W '
setw -g window-status-current-format '#[fg=colour235,bg=colour211,bold] #I #W #[fg=colour211,bg=colour235,nobold]'

# Pane border colors
set -g pane-border-style fg=colour238        # Rose Pine overlay
set -g pane-active-border-style fg=colour66  # Rose Pine pine

# Message colors
set -g message-style bg=colour140,fg=colour235


# ============================================================================
# SESSION MANAGEMENT
# ============================================================================

# Don't exit tmux when closing a session
set -g detach-on-destroy off

# Aggressive resize - useful when using tmux with multiple clients
setw -g aggressive-resize on


# ============================================================================
# MISCELLANEOUS SETTINGS
# ============================================================================

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ============================================================================
# PLUGINS (TPM - Tmux Plugin Manager)
# ============================================================================
# Uncomment the following lines if you want to use TPM
# You'll need to install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Custom ressurect keybindings (<leader> + S to save and <leader> + R to restore)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
# Also save/restore pane contents (scrollback) along with the layout
set -g @resurrect-capture-pane-contents 'on'
# NOTE: uncomment if want the saves to be here (by default they are here: ~/.local/share/tmux/resurrect)
# set -g @resurrect-dir '~/.config/tmux/resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'
# Automatically restore the last saved environment when tmux starts,
# and keep saving every 15 minutes in the background
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
